<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1440"/>
  <title>Mastisk — a personal knowledge wiki</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="article.jsx"></script>
  <script type="text/babel" src="views.jsx"></script>
  <script type="text/babel" src="mobile.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAKS = /*EDITMODE-BEGIN*/{
      "accent": "amber",
      "density": "cozy",
      "serif": "source-serif",
      "showTweaks": false
    }/*EDITMODE-END*/;

    const ACCENTS = {
      amber:   { h: 28,  label: 'Amber' },
      rose:    { h: 18,  label: 'Rose' },
      emerald: { h: 160, label: 'Emerald' },
      violet:  { h: 290, label: 'Violet' },
      ink:     { h: 240, label: 'Ink' },
    };
    const SERIFS = {
      'source-serif': { css: "'Source Serif 4', Georgia, serif", label: 'Source Serif' },
      'editorial':    { css: "'Playfair Display', Georgia, serif", label: 'Playfair' },
      'iowan':        { css: "'Iowan Old Style', Georgia, serif", label: 'Iowan' },
    };

    function App() {
      const [theme, setTheme] = useState(localStorage.getItem('mk-theme') || 'light');
      const [view, setView] = useState(localStorage.getItem('mk-view') || 'article');
      const [currentArticle, setCurrentArticle] = useState('ttc');
      const [sideOpen, setSideOpen] = useState(true);
      const [railOpen, setRailOpen] = useState(true);
      const [askOpen, setAskOpen] = useState(false);
      const [askCtx, setAskCtx] = useState(null);
      const [editMode, setEditMode] = useState(false);
      const [tweaks, setTweaks] = useState(TWEAKS);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('mk-theme', theme);
      }, [theme]);
      useEffect(() => { localStorage.setItem('mk-view', view); }, [view]);

      // apply tweaks
      useEffect(() => {
        document.documentElement.style.setProperty('--accent-h', ACCENTS[tweaks.accent].h);
        document.documentElement.style.setProperty('--accent', `oklch(0.68 0.17 ${ACCENTS[tweaks.accent].h})`);
        document.documentElement.style.setProperty('--accent-soft', `oklch(0.68 0.17 ${ACCENTS[tweaks.accent].h} / 0.12)`);
        document.documentElement.style.setProperty('--serif', SERIFS[tweaks.serif].css);
      }, [tweaks]);

      // edit-mode protocol
      useEffect(() => {
        const onMsg = (e) => {
          if (e.data?.type === '__activate_edit_mode') setEditMode(true);
          if (e.data?.type === '__deactivate_edit_mode') setEditMode(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({type:'__edit_mode_available'}, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const setTweak = (k, v) => {
        const next = { ...tweaks, [k]: v };
        setTweaks(next);
        window.parent.postMessage({type:'__edit_mode_set_keys', edits:{[k]: v}}, '*');
      };

      const navigate = (v, id) => {
        setView(v);
        if (v === 'article' && id) setCurrentArticle(id);
      };
      const openAsk = (prompt, selection) => {
        setAskCtx({ prompt, selection });
        setAskOpen(true);
      };

      const data = MASTISK_DATA;
      const article = data.article;

      return (
        <div className="app" data-rail={railOpen ? 'open' : 'closed'} data-side={sideOpen ? 'open' : 'closed'}>
          <Titlebar view={view} theme={theme}
            onTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
            onToggleSide={() => setSideOpen(s => !s)}
            onToggleRail={() => setRailOpen(s => !s)}
            onAsk={() => openAsk("What's most important in my wiki right now?", null)}
          />
          {sideOpen && <Sidebar vault={data.vault} pinned={data.pinned}
            currentView={view} currentArticle={currentArticle}
            onNavigate={navigate}/>}

          <main className="main">
            {view === 'article' && <ArticleView article={article} onAsk={openAsk} onNavigate={navigate}/>}
            {view === 'digest' && <DigestView digest={data.digest} onNavigate={navigate} onAsk={openAsk}/>}
            {view === 'feed' && <AgentsView agents={data.agents} feed={data.feed}/>}
            {view === 'agents' && <AgentsView agents={data.agents} feed={data.feed}/>}
            {view === 'graph' && <GraphView onNavigate={navigate}/>}
            {view === 'mobile' && <MobileView/>}
            {['queue','ingest','lint'].includes(view) && (
              <div className="view">
                <div className="view-h">System</div>
                <h1 className="view-title">Coming soon</h1>
                <p className="view-sub">This view isn't built out in the prototype yet. The structure is there — pick a different item in the sidebar.</p>
              </div>
            )}
          </main>

          {railOpen && view === 'article' && <RightRail article={article} feed={data.feed} onAsk={openAsk} onNavigate={navigate}/>}
          {railOpen && view !== 'article' && <SystemRail view={view} onNavigate={navigate}/>}

          <AskDrawer open={askOpen} ctx={askCtx} onClose={() => setAskOpen(false)}/>

          {editMode && <TweaksPanel tweaks={tweaks} setTweak={setTweak}/>}
        </div>
      );
    }

    function SystemRail({ view, onNavigate }) {
      return (
        <aside className="rail">
          <div className="rail-section">
            <div className="rail-h">Jump to</div>
            {[
              {id:'digest', l:'Daily Digest', d:'Today · Apr 20'},
              {id:'article', l:'Test-time compute', d:'Concept · hot this week'},
              {id:'graph', l:'Graph view', d:'522 pages'},
              {id:'agents', l:'Agents', d:'5 active · 3 idle'},
              {id:'mobile', l:'Mobile companion', d:'PWA preview'},
            ].map(j => (
              <div key={j.id} className="rel-row" onClick={() => onNavigate(j.id === 'article' ? 'article' : j.id, j.id === 'article' ? 'ttc' : undefined)}
                style={{flexDirection:'column',alignItems:'flex-start',gap:2}}>
                <div style={{color:'var(--fg)',fontSize:13}}>{j.l}</div>
                <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--fg-faint)'}}>{j.d}</div>
              </div>
            ))}
          </div>
          <div className="rail-section">
            <div className="rail-h">Live feed
              <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:9,color:'var(--accent)'}}>
                <span style={{width:5,height:5,borderRadius:'50%',background:'var(--accent)',animation:'pulse 1.6s infinite'}}/>LIVE
              </span>
            </div>
            {MASTISK_DATA.feed.slice(0, 5).map((f, i) => (
              <div key={i} className="tick-row">
                <div className="tick-time">{f.t}</div>
                <div className="tick-body">
                  <span className={`tick-agent ${MASTISK_DATA.agents.find(a=>a.id===f.agent)?.color || ''}`}>{f.agent}</span>
                  <span className="tick-verb"> {f.verb}</span>{' '}
                  <span className="tick-obj">{f.obj}</span>
                </div>
              </div>
            ))}
          </div>
        </aside>
      );
    }

    function TweaksPanel({ tweaks, setTweak }) {
      return (
        <div className="tweaks">
          <div className="tweaks-h">Tweaks</div>
          <div className="tweaks-row">
            <div className="label">Accent</div>
            <div className="value">
              {Object.entries(ACCENTS).map(([k, a]) => (
                <div key={k} className={`tweak-swatch ${tweaks.accent === k ? 'sel' : ''}`}
                  onClick={() => setTweak('accent', k)}
                  style={{background:`oklch(0.68 0.17 ${a.h})`}} title={a.label}/>
              ))}
            </div>
          </div>
          <div className="tweaks-row">
            <div className="label">Serif</div>
            <div className="value">
              {Object.entries(SERIFS).map(([k, s]) => (
                <div key={k} className={`tweak-pill ${tweaks.serif === k ? 'sel' : ''}`}
                  onClick={() => setTweak('serif', k)}>{s.label}</div>
              ))}
            </div>
          </div>
          <div className="tweaks-row">
            <div className="label">Density</div>
            <div className="value">
              {['compact','cozy','comfortable'].map(d => (
                <div key={d} className={`tweak-pill ${tweaks.density === d ? 'sel' : ''}`}
                  onClick={() => setTweak('density', d)}>{d}</div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
